    <!-- Título y Definición Principal del Sistema -->
    <title>Kanasta POS — Abasto · Inventario · Caja</title>
    <meta
      name="description"
      content="Kanasta POS es un sistema integral de punto de venta (POS) y control de inventario multimoneda diseñado para abastos, bodegones, minimarkets y comercios minoristas. Proporciona facturación ágil con doble denominación monetaria (Bolívares VES y Dólares USD según tasa oficial BCV), gestión integral de compras y proveedores, catálogo de productos con código de barras, control de existencias en tiempo real con kardex, arqueo de caja por turnos y reportes financieros."
    />
    <meta
      name="keywords"
      content="kanasta pos, punto de venta, inventario multimoneda, sistema pos abasto, facturacion venezuela, tasa bcv, arqueo de caja, compras proveedores, kardex existencias, codigo de barras, minimarket, supermercado, tauri pos"
    />
